<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <header>
        <h1>Course Registration Form</h1>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Personal details grouped using fieldset and legend -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your name"><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            </fieldset>

            <br>

            <!-- Course selection grouped using fieldset and legend -->
            <fieldset>
                <legend>Course Selection</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="cloud">Cloud Computing</option>
                    <option value="devops">DevOps Fundamentals</option>
                    <option value="webdev">Web Development</option>
                    <option value="dsa">Data Structures and Algorithms</option>
                </select>
            </fieldset>

            <br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear Form">

        </form>

        <!-- Table showing available course schedules -->
        <h2>Available Course Schedules</h2>
        <table border="1" cellpadding="6">
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 12:00 PM</td>
                <td>Dr. Anil Sharma</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>2:00 PM - 4:00 PM</td>
                <td>Prof. Meera Iyer</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>11:00 AM - 1:00 PM</td>
                <td>Dr. Anil Sharma</td>
            </tr>
        </table>

    </main>

    <footer>
        <p>&copy; 2026 Course Registration Portal.</p>
    </footer>

</body>
</html>

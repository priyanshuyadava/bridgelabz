<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- Main heading: school name -->
    <h1>Green Valley Public School</h1>

    <h2>Student Report Card</h2>

    <!-- Marks table -->
    <table border="1" cellpadding="6">
        <tr>
            <th>Subject</th>
            <th title="Marks obtained out of maximum marks">Marks Obtained</th>
            <th>Maximum Marks</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>85</td>
            <td>100</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Chemistry</td>
            <td>78</td>
            <td>100</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>English</td>
            <td>88</td>
            <td>100</td>
            <td>A</td>
        </tr>

        <!-- Total and Percentage row using rowspan and colspan -->
        <tr>
            <td colspan="2" title="Sum of all subject marks">Total</td>
            <td colspan="2">438 out of 500</td>
        </tr>
        <tr>
            <td colspan="2" title="Overall percentage of marks">Percentage</td>
            <td colspan="2">87.6%</td>
        </tr>
    </table>

</body>
</html>
